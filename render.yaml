# Blueprint Render : backend Express + PostgreSQL
# Render > New > Blueprint > sélectionner ce dépôt
services:
  - type: web
    name: zuri-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Les migrations tournent au démarrage (preDeployCommand n'existe pas en plan gratuit)
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: zuri-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://zuri-dusky-seven.vercel.app
      # Mots de passe des comptes du seed, générés par Render (visibles dans Environment)
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_CLIENT_PASSWORD
        generateValue: true
      - key: SEED_PRO_PASSWORD
        generateValue: true

databases:
  - name: zuri-db
    plan: free
    region: frankfurt
    databaseName: zuri
    user: zuri
