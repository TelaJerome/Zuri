version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: beaute_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beaute
      POSTGRES_PASSWORD: beaute
      POSTGRES_DB: beaute
    ports:
      - '5432:5432'
    volumes:
      - beaute_pgdata:/var/lib/postgresql/data

volumes:
  beaute_pgdata:
